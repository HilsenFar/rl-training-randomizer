<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RL Roll — training pack randomizer</title>
<meta name="description" content="Roll a random Rocket League training pack, or filter by category, difficulty or tag first.">
<meta name="theme-color" content="#101A2E">
<link rel="icon" href="data:,">
<!-- The same Archivo file the landing page ships. '../' works in both homes of
     this page: on the site (/app/ -> /archivo-var.woff2 in docs/) and in the
     local app (served from public/, where '../' stops at the root). If the file
     is missing the page falls back to Segoe UI and nothing else changes. -->
<link rel="preload" href="../archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: 'Archivo';
    src: url('../archivo-var.woff2') format('woff2');
    font-weight: 100 900; font-stretch: 62% 125%; font-style: normal; font-display: swap;
  }
  /* "Stadium night", the RL family skin shared with rltracker, rankoverlay and
     roll.gitato.net. Milled plates: one cut corner top right, a lit chamfer. */
  :root {
    --night: #101A2E; --deck: #172440; --well: #070D19;
    --line: #27D9C0; --boost: #FF9E2C; --boost-dk: #B26A12; --blue: #38B6FF;
    --ink: #EAF2FF; --ink2: #B8C7E0; --ink3: #8CA0BF;
    --on-boost: #1A1206; --ok: #35D08C;
    --edge: rgba(184, 199, 224, .13);
    --chamfer: inset 0 1px 0 rgba(196,224,255,.24), inset 1px 0 0 rgba(196,224,255,.11),
               inset -1px 0 0 rgba(0,0,0,.38), inset 0 -1px 0 rgba(0,0,0,.60);
    --f: 'Archivo', 'Segoe UI', system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html {
    min-height: 100%;
    background:
      radial-gradient(110% 55% at 50% -10%, rgba(120, 160, 215, .18), transparent 62%),
      radial-gradient(60% 40% at 50% 115%, rgba(39, 217, 192, .07), transparent 70%),
      var(--night);
    background-attachment: fixed;
  }
  body {
    margin: 0; color: var(--ink2);
    font: 15px/1.55 var(--f); font-stretch: 100%;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); }
  :focus-visible { outline: 2px solid var(--line); outline-offset: 3px; }

  header { max-width: 900px; margin: 0 auto; padding: 30px 18px 6px; }
  .eyebrow {
    display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center;
    font-size: 11.5px; font-weight: 600; font-stretch: 88%;
    letter-spacing: .16em; text-transform: uppercase; color: var(--ink3);
  }
  .eyebrow a { color: var(--ink3); text-decoration: none; border-bottom: 1px solid transparent; }
  .eyebrow a:hover { color: var(--ink); border-bottom-color: currentColor; }
  .eyebrow .sep { color: var(--line); }
  h1 {
    margin: 10px 0 0;
    font-size: clamp(30px, 5vw, 44px); font-weight: 850; font-stretch: 112%;
    line-height: 1.05; letter-spacing: -.005em; text-transform: uppercase; color: var(--ink);
  }
  h1 span { color: var(--boost); }
  .sub { margin-top: 6px; color: var(--ink3); font-size: 13.5px; font-variant-numeric: tabular-nums; }

  main { max-width: 900px; margin: 0 auto; padding: 14px 18px 64px; }

  .plate {
    background:
      linear-gradient(187deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.01) 34%, rgba(0,0,0,.06) 58%, rgba(190,220,255,.02) 100%),
      linear-gradient(163deg, #1E2B47 0%, #172440 44%, #0C1526 100%);
    border: 1px solid var(--edge);
    border-radius: 3px 13px 3px 3px;
    box-shadow: var(--chamfer), 0 1px 0 rgba(0,0,0,.85), 0 10px 24px -12px rgba(0,0,0,.6);
  }
  @supports (corner-shape: bevel) { .plate, .card { corner-shape: round bevel round round; } }

  .controls {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px; padding: 16px; margin: 14px 0 18px;
  }
  label {
    display: block; margin-bottom: 6px;
    font-size: 10.5px; font-weight: 700; font-stretch: 80%;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink2);
  }
  select, input {
    width: 100%; min-height: 42px; padding: 9px 10px;
    font: inherit; font-size: 14.5px; color: var(--ink);
    background: var(--well); border: 1px solid var(--edge); border-radius: 3px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.75), inset 0 -1px 0 rgba(196,224,255,.06);
  }
  select:hover, input:hover { border-color: rgba(184, 199, 224, .28); }

  .rollbar { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; justify-content: center; margin: 4px 0 22px; }
  button.roll {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 15px 38px;
    font: inherit; font-size: 18px; font-weight: 850; font-stretch: 110%;
    letter-spacing: .08em; text-transform: uppercase; color: var(--on-boost);
    background: linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.05) 30%, transparent 58%),
                linear-gradient(180deg, #FFC271, var(--boost) 55%, #D8801A);
    border: 0; border-radius: 4px; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px var(--boost-dk),
                0 3px 10px rgba(0,0,0,.45), 0 0 30px -8px rgba(255,158,44,.65);
    transition: filter .15s ease, box-shadow .15s ease, transform .08s ease;
  }
  button.roll:hover { filter: brightness(1.06); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 1px var(--boost-dk), 0 3px 12px rgba(0,0,0,.5), 0 0 42px -6px rgba(255,158,44,.8); }
  button.roll:active { transform: translateY(1px); }
  button.roll svg { width: 24px; height: 24px; }
  .count {
    font-size: 11.5px; font-weight: 600; font-stretch: 88%;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink3);
    font-variant-numeric: tabular-nums;
  }

  /* Cards are built by app.js: .card .meta .codewrap .code button.copy .tags .tag .note .empty */
  .cards { display: grid; gap: 14px; }
  .card {
    position: relative;
    padding: 18px 20px 18px 24px;
    background:
      linear-gradient(187deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,.01) 34%, rgba(0,0,0,.06) 58%, rgba(190,220,255,.02) 100%),
      linear-gradient(163deg, #1E2B47 0%, #172440 44%, #0C1526 100%);
    border: 1px solid var(--edge);
    border-radius: 3px 13px 3px 3px;
    box-shadow: var(--chamfer), 0 1px 0 rgba(0,0,0,.85), 0 10px 24px -12px rgba(0,0,0,.6);
    animation: land .32s cubic-bezier(.2, .7, .2, 1) both;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px;
    background: linear-gradient(180deg, var(--line), #0E6C60);
    box-shadow: 0 0 10px -1px rgba(39, 217, 192, .55);
  }
  .card:nth-child(2) { animation-delay: .04s; } .card:nth-child(3) { animation-delay: .08s; }
  .card:nth-child(4) { animation-delay: .12s; } .card:nth-child(n+5) { animation-delay: .16s; }
  @keyframes land { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  .card h3 { margin: 0 0 4px; font-size: 19px; font-weight: 750; color: var(--ink); letter-spacing: .005em; }
  .meta { color: var(--ink3); font-size: 13px; margin-bottom: 12px; }
  .meta b { color: var(--ink2); font-weight: 650; }
  .codewrap { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .code {
    display: inline-flex; align-items: center;
    padding: 9px 14px;
    font: 700 17px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
    letter-spacing: .08em; color: var(--ink);
    background: var(--well); border: 1px solid var(--edge); border-radius: 3px;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.75);
    user-select: all;
  }
  button.copy {
    padding: 9px 14px; cursor: pointer;
    font: inherit; font-size: 12.5px; font-weight: 700; font-stretch: 88%;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--line); background: rgba(7, 13, 25, .6);
    border: 1px solid rgba(39, 217, 192, .5); border-radius: 3px;
    transition: background .15s ease, color .15s ease;
  }
  button.copy:hover { background: rgba(39, 217, 192, .12); }
  button.copy.done { color: var(--ok); border-color: var(--ok); }
  .tags { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    padding: 3px 9px;
    font-size: 11px; font-weight: 600; font-stretch: 88%; letter-spacing: .06em;
    color: var(--ink2); background: rgba(7, 13, 25, .55);
    border: 1px solid var(--edge); border-radius: 3px;
  }
  .note { margin-top: 12px; color: var(--ink3); font-size: 13px; }
  .empty { text-align: center; color: var(--ink3); padding: 30px; }

  .hint {
    margin-top: 26px; text-align: center;
    font-size: 13px; color: var(--ink3);
  }
  .hint b { color: var(--ink2); font-weight: 650; }

  @media (max-width: 760px) {
    .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .controls > :first-child { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow">
    <a href="https://roll.gitato.net/">RL Roll</a><span class="sep">·</span><span>Training pack randomizer</span>
  </div>
  <h1>Roll <span>for it.</span></h1>
  <div class="sub" id="sub">loading…</div>
</header>
<main>
  <div class="controls plate">
    <div><label for="f-collection">Collection</label><select id="f-collection"></select></div>
    <div><label for="f-category">Category</label><select id="f-category"></select></div>
    <div><label for="f-difficulty">Difficulty</label><select id="f-difficulty"></select></div>
    <div><label for="f-tag">Tag</label><select id="f-tag"></select></div>
    <div><label for="f-n">How many</label><input id="f-n" type="number" min="1" max="12" value="1"></div>
  </div>
  <div class="rollbar">
    <button class="roll" id="roll">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/></svg>
      Roll
    </button>
    <span class="count" id="matchcount" aria-live="polite"></span>
  </div>
  <div class="cards" id="cards" aria-live="polite"></div>
  <div class="hint">In Rocket League: <b>Training → Custom Training → Use Code</b>, then paste the code.</div>
</main>

<script src="app.js"></script>
</body>
</html>
